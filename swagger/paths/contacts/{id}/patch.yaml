tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: Update an example contact by ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    description: ID of the contact to update
    schema:
      type: string
      example: 68c31235d7c88ccdda403a47
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Contact name
            example: John Doe
          phoneNumber:
            type: string
            description: Contact phone number
            example: +380981234567
          email:
            type: string
            description: Contact email
            example: john@example.com
          contactType:
            type: string
            enum: [personal, work, home]
            description: Type of contact
            example: work
          isFavourite:
            type: boolean
            description: If contact is a favourote
            example: true
          photo:
            type: string
            format: binary
            description: New contact photo
responses:
  '200':
    description: Successfully updated contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact!
            data:
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
